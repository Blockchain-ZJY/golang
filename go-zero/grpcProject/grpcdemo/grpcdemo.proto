syntax = "proto3";

package grpcdemo;

option go_package = "./grpcdemo";

message User {
    string id = 1;
    string name = 2;
    int32 age = 3; // 建议使用 int32 或 int64 替代 int
}

// 定义订单状态的枚举
enum OrderStatus {
    // 零值枚举必须是第一个，这是 proto3 的规范
    UNKNOWN = 0;
    PENDING = 1;    // 待处理
    PROCESSING = 2; // 处理中
    SHIPPED = 3;    // 已发货
    DELIVERED = 4;  // 已送达
    CANCELLED = 5;  // 已取消
}

// 定义订单中的单个商品信息
message OrderItem {
    string product_id = 1;   // 商品ID
    string product_name = 2; // 商品名称
    int32 quantity = 3;      // 数量
    double price = 4;        // 单价
}

// 定义单个订单的详细信息
message Order {
    string order_id = 1;           // 订单ID
    string user_id = 2;            // 用户ID
    repeated OrderItem items = 3;  // 订单中的商品列表 (repeated 表示这是一个列表)
    double total_amount = 4;       // 订单总金额
    int64 create_time = 5;         // 订单创建时间 (例如：Unix 时间戳)
    OrderStatus status = 6;        // 订单状态
}

// Orders 消息，代表一个或多个订单的集合
message Orders {
    repeated Order orders = 1; // 包含多个 Order 消息的列表
}

service MoreTestFromAccount2Order {
    rpc getMyOrder(User) returns(Orders);
}