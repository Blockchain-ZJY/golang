syntax = "proto3";

option go_package = "example.com/complex_example/proto/order";

package order;

// 订单服务
service Order {
  // 创建订单 (一元 RPC)
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderReply);

  // 追踪订单状态 (服务端流式 RPC)
  // 客户端发送一个请求，服务端会持续返回多个状态更新
  rpc TrackOrder(TrackOrderRequest) returns (stream TrackOrderReply);
}

message CreateOrderRequest {
  string product_id = 1;
  int32 quantity = 2;
  string user_id = 3;
}

message CreateOrderReply {
  string order_id = 1;
  string message = 2;
}

message TrackOrderRequest {
  string order_id = 1;
}

message TrackOrderReply {
  string order_status = 1;
}